<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Login Form</title>
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    </head>
    <body>

        <div class="container">
            <div class="form-box">

                <div class="form-header">
                    <div class="logo">
                        <i class="fa-solid fa-rocket"></i>
                    </div>
                    <h1 id="title">Welcome Back</h1>
                    <p class="subtitle">Sign in to your account</p>
                </div>

                <form id="loginForm">
                    <div class="input-group">

                        <div class="input-field" id="nameField">
                            <i class="fa-solid fa-user"></i>
                            <input type="text" id="nameInput" placeholder="Full Name">
                        </div>
                        <span class="error-msg" id="nameError">
                            <i class="fa-solid fa-circle-exclamation"></i> Name is required.
                        </span>

                        <div class="input-field">
                            <i class="fa-solid fa-envelope"></i>
                            <input type="email" id="emailInput" placeholder="Email Address">
                        </div>
                        <span class="error-msg" id="emailError">
                            <i class="fa-solid fa-circle-exclamation"></i> Please enter a valid email.
                        </span>

                        <div class="input-field">
                            <i class="fa-solid fa-lock"></i>
                            <input type="password" id="passwordInput" placeholder="Password">
                            <i class="fa-solid fa-eye toggle-password" id="togglePassword"></i>
                        </div>
                        <span class="error-msg" id="passwordError">
                            <i class="fa-solid fa-circle-exclamation"></i> Password must be at least 6 characters.
                        </span>

                        <p class="forgot-link">
                            Lost Password? <a href="#">Click Here!</a>
                        </p>
                    </div>

                    <div class="btn-field">
                        <button type="button" id="loginBtn">
                            <span>Login</span>
                            <i class="fa-solid fa-arrow-right"></i>
                        </button>
                    </div>
                </form>

                <!-- Success message -->
                <div class="success-box" id="successBox">
                    <div class="success-icon">
                        <i class="fa-solid fa-circle-check"></i>
                    </div>
                    <h2>Login Successful!</h2>
                    <p>Welcome back! You have logged in successfully.</p>
                    <button type="button" id="backBtn">
                        <i class="fa-solid fa-arrow-left"></i> Go Back
                    </button>
                </div>

            </div>
        </div>

        <script src="script.js"></script>
    </body>
</html>
